# ============================================================================
# dsh-programmer-chatroom —— 会合点（Rendezvous）后端 示例配置
# ----------------------------------------------------------------------------
# 使用步骤：
#   1. 把本文件复制一份并重命名为 wrangler.toml（本目录下）
#   2. 登录 Cloudflare：npx wrangler login
#   3. 创建 KV 命名空间并把 id 填入下方（见 [[kv_namespaces]] 注释）
#   4. 部署：npx wrangler deploy
#   5. 本地预览：npx wrangler dev
# ============================================================================

# Worker 名称（显示在 Cloudflare 控制台，可自行改名）
name = "dsh-programmer-chatroom-rendezvous"

# 入口脚本（与本文件同目录的 rendezvous.js）
main = "rendezvous.js"

# 兼容日期：告诉 Cloudflare 启用该日期之后的 API 行为。
# 若之后用到更新的 API，可把日期调新；不要比实际需要更旧。
compatibility_date = "2024-11-01"

# ----------------------------------------------------------------------------
# KV 命名空间绑定 —— 在线节点目录的存储
# ----------------------------------------------------------------------------
# 创建方法（二选一）：
#   A. 控制台：Cloudflare 仪表盘 -> Workers & Pages -> KV -> 创建命名空间
#      （建议命名为 RENDEZVOUS），复制页面给出的 namespace id 粘到下面。
#   B. 命令行：npx wrangler kv namespace create RENDEZVOUS
#      （该命令会打印一行 id，把它粘到下面即可）
[[kv_namespaces]]
binding = "RENDEZVOUS" # 代码里通过 env.RENDEZVOUS 访问，请勿改名
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID" # <-- 把这里换成真实的 namespace id

# ----------------------------------------------------------------------------
# 访问方式（可选，默认即可用）
# ----------------------------------------------------------------------------
# 部署后默认会得到一个 https://<你的子域>.workers.dev 地址，无需额外配置。
# 若想绑定自有域名：在 Cloudflare 仪表盘 -> Workers & Pages -> 该 Worker ->
# “设置 -> 域与路由”里添加即可（比手写 toml 路由更不易出错）。
#
# 提醒：本服务是“开放目录”，无鉴权，v1 协议如此设计 —— 上线前请确认
# 你能接受任何人读写这个目录；KV 记录带 TTL 自动过期，无需人工清理。
